# XcodeGen spec: run `xcodegen generate` to create Deskfocus.xcodeproj (the project file is not committed).
name: Deskfocus

options:
  bundleIdPrefix: com.bilgaaaaa
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Deskfocus.xcconfig
  Release: Config/Deskfocus.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: $(DESKFOCUS_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # English and Italian via String Catalogs; texts are extracted from code at build time.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Deskfocus:
    type: application
    platform: macOS
    sources:
      - Deskfocus
      - Shared
    dependencies:
      - target: DeskfocusWidget
    # Shared "Deskfocus" scheme, so command-line builds (release script, CI) find it.
    scheme: {}
    info:
      path: Deskfocus/Info.plist
      properties:
        CFBundleDisplayName: Deskfocus
        # Version comes from MARKETING_VERSION / CURRENT_PROJECT_VERSION above, never hardcoded.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSCalendarsUsageDescription: Deskfocus shows today's events so you can focus on them.
        NSCalendarsFullAccessUsageDescription: Deskfocus shows today's events so you can focus on them.
        NSRemindersUsageDescription: Deskfocus shows today's reminders and marks them done when you finish.
        NSRemindersFullAccessUsageDescription: Deskfocus shows today's reminders and marks them done when you finish.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        DeskfocusAppGroupIdentifier: $(TeamIdentifierPrefix)com.bilgaaaaa.deskfocus
    entitlements:
      path: Deskfocus/Deskfocus.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.bilgaaaaa.deskfocus
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilgaaaaa.deskfocus
        PRODUCT_NAME: Deskfocus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DeskfocusWidget:
    type: app-extension
    platform: macOS
    sources:
      - DeskfocusWidget
      - Shared
    info:
      path: DeskfocusWidget/Info.plist
      properties:
        CFBundleDisplayName: Deskfocus
        # Must match the app's version, or macOS warns about a mismatched embedded extension.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        DeskfocusAppGroupIdentifier: $(TeamIdentifierPrefix)com.bilgaaaaa.deskfocus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DeskfocusWidget/DeskfocusWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.bilgaaaaa.deskfocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilgaaaaa.deskfocus.widget
        PRODUCT_NAME: DeskfocusWidget
        SKIP_INSTALL: YES

  # iPhone and iPad app. Same bundle id as the Mac app, so one Google client id and, later, one App Store record serve both.
  DeskfocusiOS:
    type: application
    platform: iOS
    sources:
      - DeskfocusiOS
      - Shared
      # The platform-neutral parts of the Mac app; everything else in Deskfocus/ is AppKit only.
      - Deskfocus/AppModel.swift
      - Deskfocus/Tasks
      - Deskfocus/Google
      - Deskfocus/Focus/FocusNotifier.swift
      - Deskfocus/AddTask/AddTaskView.swift
      - Deskfocus/Views/CompleteTaskButton.swift
      - Deskfocus/Views/EndSessionButton.swift
      - Deskfocus/Views/StartFocusControl.swift
      - Deskfocus/InfoPlist.xcstrings
    dependencies:
      - target: DeskfocusiOSWidget
    # Shared "DeskfocusiOS" scheme, so command-line builds (CI) find it.
    scheme: {}
    info:
      path: DeskfocusiOS/Info.plist
      properties:
        CFBundleDisplayName: Deskfocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The glass look is dark everywhere, sheets and keyboards included.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSCalendarsUsageDescription: Deskfocus shows today's events so you can focus on them.
        NSCalendarsFullAccessUsageDescription: Deskfocus shows today's events so you can focus on them.
        NSRemindersUsageDescription: Deskfocus shows today's reminders and marks them done when you finish.
        NSRemindersFullAccessUsageDescription: Deskfocus shows today's reminders and marks them done when you finish.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        # iOS App Group ids start with "group."; Xcode registers it on the first signed build.
        DeskfocusAppGroupIdentifier: group.com.bilgaaaaa.deskfocus
    entitlements:
      path: DeskfocusiOS/DeskfocusiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bilgaaaaa.deskfocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilgaaaaa.deskfocus
        PRODUCT_NAME: Deskfocus
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hardened Runtime is a macOS setting.
        ENABLE_HARDENED_RUNTIME: NO

  # Home Screen widget (the same view as the Mac widget) and the focus timer's Live Activity.
  DeskfocusiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - DeskfocusiOSWidget
      - Shared
      # The generated Info.plist and entitlements in DeskfocusWidget/ belong to the Mac extension.
      - path: DeskfocusWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: DeskfocusiOSWidget/Info.plist
      properties:
        CFBundleDisplayName: Deskfocus
        # Must match the app's version, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        DeskfocusAppGroupIdentifier: group.com.bilgaaaaa.deskfocus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DeskfocusiOSWidget/DeskfocusiOSWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bilgaaaaa.deskfocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilgaaaaa.deskfocus.widget
        PRODUCT_NAME: DeskfocusWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
