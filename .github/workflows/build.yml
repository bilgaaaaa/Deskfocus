name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Newest Xcode on the runner, so the macOS 26 Liquid Glass code path is compiled when available.
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Unsigned build: checks that the app and widget compile.
      - name: Build
        run: |
          xcodebuild build \
            -project Deskfocus.xcodeproj \
            -scheme Deskfocus \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log
          exit ${PIPESTATUS[0]}

      # Texts the compiler extracted, used to keep the String Catalogs complete.
      - name: Collect extracted strings
        if: always()
        run: |
          mkdir -p extracted-strings
          find ~/Library/Developer/Xcode/DerivedData -name "*.stringsdata" -exec cp {} extracted-strings/ \; || true
          cp Shared/Localizable.xcstrings extracted-strings/ || true

      - name: Upload extracted strings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-strings
          path: extracted-strings
          if-no-files-found: ignore

      # Temporary: publish the extracted strings on a scratch branch so they can be fetched with git.
      - name: Publish extracted strings
        if: always() && github.ref == 'refs/heads/tasks-and-italian'
        run: |
          git config user.name "Deskfocus CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-extracted-strings
          git rm -rf --cached . > /dev/null
          git add -f extracted-strings
          git commit -q -m "Extracted strings"
          git push -f origin ci-extracted-strings
